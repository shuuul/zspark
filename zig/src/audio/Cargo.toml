[package]
name = "zs_audio_codecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
path = "codecs.rs"
crate-type = ["staticlib"]

[dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "alac", "isomp4", "mkv", "ogg"] }
symphonia-opus = "=0.1.3"
